name: Build mobipeg (SSE4.2 only)

on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux-sse42:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - name: Install build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential pkgconf nasm autoconf automake libtool

      # Build x264 fork WITHOUT any assembly (no AVX/AVX2/AVX512)
      - name: Build x264 (SSE4.2 only, no asm)
        run: |
          DEPS="${GITHUB_WORKSPACE}/deps"
          mkdir -p "$DEPS"
          git clone --depth=1 https://github.com/quatric/x264.git x264-src
          cd x264-src
          ./configure \
            --prefix="$DEPS" \
            --enable-static \
            --enable-pic \
            --disable-cli \
            --disable-opencl \
            --disable-asm
          make -j$(nproc) && make install

      # Configure FFmpeg with SSE4.2 ceiling — no AVX/AVX2/AVX512/FMA
      - name: Configure FFmpeg
        run: |
          DEPS="${GITHUB_WORKSPACE}/deps"
          export PKG_CONFIG_PATH="$DEPS/lib/pkgconfig:$PKG_CONFIG_PATH"
          ./configure \
            --prefix="$PWD/dist" \
            --arch=x86_64 \
            --enable-gpl \
            --enable-static \
            --disable-shared \
            --disable-doc \
            --disable-debug \
            --disable-sdl2 \
            --disable-bzlib \
            --disable-lzma \
            --disable-iconv \
            --disable-xlib \
            --enable-libx264 \
            --pkg-config-flags="--static" \
            --extra-cflags="-I$DEPS/include -msse4.2 -mno-avx -mno-avx2 -mno-fma -mno-xop -mno-f16c -mno-fma4 -mno-avx512f -mno-avx512bw -mno-avx512vl -mno-avx512dq" \
            --extra-ldflags="-L$DEPS/lib" \
          || { cat ffbuild/config.log; exit 1; }

      - name: Build
        run: make -j$(nproc)

      - name: Install
        run: make install

      - name: Verify no AVX instructions
        run: |
          echo "=== Checking for AVX/AVX2/AVX512 in binaries ==="
          AVX_COUNT=$(objdump -d dist/bin/ffmpeg 2>/dev/null | grep -cE '\b(vpxor|vpaddd|vmovdqu|vpunpck|ymm[0-9])' || true)
          echo "AVX/AVX2 instruction count: $AVX_COUNT"
          if [ "$AVX_COUNT" -gt 0 ]; then
            echo "ERROR: Binary contains AVX instructions!"
            exit 1
          fi
          echo "OK: No AVX instructions found — safe for Celeron N4500"

      - name: Package
        run: |
          cd dist/bin
          tar -czf "../../mobipeg-linux-sse42.tar.gz" ffmpeg ffprobe

      - uses: actions/upload-artifact@v6
        with:
          name: mobipeg-linux-sse42
          path: mobipeg-linux-sse42.tar.gz
          retention-days: 30
